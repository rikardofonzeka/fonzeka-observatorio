name: Actualizar monitor y desplegar Observatorio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MESA_TOKEN: ${{ secrets.FONZEKA_MESA_SERVICE_TOKEN }}
      MESA_ORIGIN: https://fonzeka-mesa-privada.rikardo-fonzeka.chatgpt.site
    steps:
      - name: Sincronizar índices oficiales con la mesa privada
        run: |
          if [[ -z "$MESA_TOKEN" ]]; then
            echo '::warning::Sincronización privada pendiente de clave de servicio'
            exit 0
          fi
          curl --fail --silent --show-error --max-time 180 \
            -H "OAI-Sites-Authorization: Bearer $MESA_TOKEN" \
            -H "X-Fonzeka-Publisher-Key: $MESA_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' "$MESA_ORIGIN/api/monitor/sync" -o "$RUNNER_TEMP/sincronizacion.json"
          python - <<'PYTHON'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP']+'/sincronizacion.json'))
          failures = [r for r in data['results'] if r['status'] != 'OK']
          print('Consultas DOF:', len(data['results']), '· Pendientes:', len(failures))
          for row in failures:
              print('::warning::DOF '+row['day']+': '+row.get('error', 'Consulta pendiente'))
          if failures:
              raise SystemExit(1)
          PYTHON
  empaquetar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.nombre.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar y preparar solo archivos públicos
        run: python scripts/empaquetar_publico.py --output "$RUNNER_TEMP/sitio-publico"
      - id: nombre
        run: echo "value=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.nombre.outputs.value }}
          path: ${{ runner.temp }}/sitio-publico
  desplegar:
    needs: empaquetar
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.empaquetar.outputs.artifact_name }}
