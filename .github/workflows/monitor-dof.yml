
name: fonzeka - Monitor DOF 0.2.2 (selector de fecha)

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha YYYY-MM-DD o auto (fecha local Monterrey)'
        required: true
        default: 'auto'
        type: string
      dias_retroceso:
        description: 'Dias anteriores a la fecha local; usar 0 con fecha explicita'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '3'
          - '7'
          - '15'
          - '30'
  schedule:
    - cron: '23 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: monitor-dof
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probar analizador
        run: python -m unittest discover -s tests -v

      - name: Consultar DOF
        env:
          FECHA: ${{ inputs.fecha || 'auto' }}
          DIAS_RETROCESO: ${{ inputs.dias_retroceso || '0' }}
        run: |
          if [[ "$FECHA" != "auto" && "$DIAS_RETROCESO" != "0" ]]; then
            echo "Error: con fecha explicita el retroceso debe ser 0"
            exit 1
          fi
          python scripts/monitor_dof.py \
            --date "$FECHA" \
            --timezone America/Monterrey \
            --days-back "$DIAS_RETROCESO" \
            --output salida_monitor

      - name: Conservar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dof-consulta-${{ github.run_number }}
          path: salida_monitor/
          if-no-files-found: warn
          retention-days: 30

      - name: Persistir historial tecnico
        if: success()
        run: |
          git config user.name "fonzeka-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_dof_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar historial tecnico DOF [skip ci]"
            git push origin HEAD:main
          fi
